name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: calidad (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Gate (ruff + bandit + pytest)
        run: ./scripts/ci.sh python

      - name: Smoke headless del agente
        run: ./scripts/smoke.sh
