[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pass-encrypt-env"
version = "1.0.0"
description = "Bóveda local de secretos con contraseña maestra + TOTP y agente de sesión sin prompts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "yosoyignicion", email = "yosoyignicion@users.noreply.github.com" }]
keywords = [
    "secrets", "vault", "password-manager", "totp", "2fa", "argon2id",
    "aes-gcm", "keyring", "environment", "linux", "privacy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42",
    "click>=8",
    "qrcode>=7",
]

[project.urls]
Homepage = "https://github.com/yosoyignicion/pass-encrypt-env"
Repository = "https://github.com/yosoyignicion/pass-encrypt-env"
Issues = "https://github.com/yosoyignicion/pass-encrypt-env/issues"
Changelog = "https://github.com/yosoyignicion/pass-encrypt-env/blob/main/CHANGELOG.md"
Documentation = "https://github.com/yosoyignicion/pass-encrypt-env/blob/main/docs/GUIA_USO.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "bandit>=1.7"]

[project.scripts]
passenv = "pass_encrypt_env.cli:main"
passenv-agent = "pass_encrypt_env.agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]
